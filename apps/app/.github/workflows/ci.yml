name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Quality gates for the APP. tsc + prisma validate are blocking; eslint is
# reported but non-blocking until the pre-existing lint baseline is cleared
# (see CLAUDE.md). Flip `continue-on-error` to false once lint is green.
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma `generate`/`validate` never connect to the database, so a dummy
      # URL is enough to satisfy tooling that expects the var to be set.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check (blocking)
        run: npx tsc --noEmit

      - name: Validate Prisma schema (blocking)
        run: npx prisma validate

      - name: Lint (non-blocking — pre-existing baseline)
        run: npx eslint .
        continue-on-error: true
